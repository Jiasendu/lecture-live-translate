<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>课堂同传</title>
<style id="app-style">
:root{
  --bg:#1B2230; --panel:#232C3D; --line:#34405A; --ink:#EEF1F6; --muted:#8C97AA;
  --sub:#F4D35E; --rec:#E5484D; --ok:#5FB3A1;
  --zh-size:30px;
  --cjk:"PingFang SC","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",system-ui,sans-serif;
  --lat:"Segoe UI","Helvetica Neue",Arial,system-ui,sans-serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#F4F5F7; --panel:#FFFFFF; --line:#D9DDE5; --ink:#1B2230; --muted:#667085; --sub:#1B2230; }
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--cjk);display:flex;flex-direction:column}

header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:18px;font-weight:600;margin:0 8px 0 0;letter-spacing:.02em}
.status{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin-right:auto;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--rec);box-shadow:0 0 0 0 rgba(229,72,77,.6);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(229,72,77,0)}100%{box-shadow:0 0 0 0 rgba(229,72,77,0)}}
@media (prefers-reduced-motion: reduce){.dot.on{animation:none}}

button,select{font:inherit;font-size:14px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover,select:hover{border-color:var(--muted)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
#toggle{background:var(--ok);border-color:var(--ok);color:#10201C;font-weight:600;padding:7px 18px}
#toggle.stop{background:var(--rec);border-color:var(--rec);color:#fff}
label.ctl{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
input[type=range]{width:90px;accent-color:var(--ok)}
select option{color:#1B2230}

#slot{flex:1;min-height:0;display:flex}
#stage{flex:1;min-height:0;overflow-y:auto;padding:24px clamp(16px,5vw,64px) 40vh}
.line{max-width:60em;margin:0 0 22px;opacity:.5;transition:opacity .3s}
.line:nth-last-child(-n+2){opacity:1}
.zh{font-size:var(--zh-size);line-height:1.5;color:var(--sub);margin:0;font-weight:500}
.zh.draft{opacity:.7}
.zh.err{color:var(--rec);font-size:15px}
.en{font-family:var(--lat);font-size:calc(var(--zh-size)*.55);line-height:1.45;color:var(--muted);margin:4px 0 0}
.line.live .en::after{content:"▍";opacity:.6;margin-left:2px}
#stage.no-en .en{display:none}

.empty{max-width:34em;margin:8vh auto 0;color:var(--muted);font-size:16px;line-height:1.8}
.empty strong{color:var(--ink);font-weight:600;display:block;font-size:20px;margin-bottom:8px}
.empty ul{padding-left:1.2em;margin:12px 0 0}

/* 悬浮窗里只显示最近几句 */
body.pip{background:var(--bg)}
body.pip #stage{padding:12px 16px 12px}
body.pip .line:not(:nth-last-child(-n+3)){display:none}
body.pip .empty{margin:4px 0;font-size:14px}
body.pip .empty ul{display:none}
</style>
</head>
<body>
<header>
  <h1>课堂同传</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="status">未开始</span></div>
  <button id="toggle">开始</button>
  <button id="pipBtn" title="打开一个始终在最前面的小窗口，方便边看课件边看翻译">悬浮窗</button>
  <label class="ctl">字号 <input type="range" id="size" min="18" max="56" value="30"></label>
  <label class="ctl"><input type="checkbox" id="showEn" checked> 显示英文</label>
  <select id="engine" title="翻译引擎">
    <option value="auto">翻译：自动</option>
    <option value="chrome">Chrome 内置（离线）</option>
    <option value="google">Google 在线</option>
  </select>
  <button id="exportBtn">导出文本</button>
  <button id="clearBtn">清空</button>
</header>

<div id="slot">
  <main id="stage" aria-live="polite">
    <div class="empty" id="empty">
      <strong>点“开始”，老师讲的英语会实时翻成中文显示在这里。</strong>
      <ul>
        <li>请用 Chrome 打开这个文件（Edge 也能用，但翻译速度可能慢一些）。</li>
        <li>第一次点开始时，浏览器会问能否使用麦克风，选“允许”。</li>
        <li>语音识别用的是系统默认麦克风，坐近一点效果更好。</li>
        <li>点“悬浮窗”可以让字幕浮在课件上面。</li>
      </ul>
    </div>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
const stage = $('stage'), slot = $('slot');
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

let rec = null, running = false, translator = null, engineUsed = 'google';
let current = null, draftTimer = null, wakeLock = null, pipWin = null;
const lines = [];

function setStatus(text, on){
  $('status').textContent = text;
  $('dot').classList.toggle('on', !!on);
}

/* ---------- 翻译 ---------- */
async function setupTranslator(){
  const want = $('engine').value;
  if (want === 'google') { translator = null; return 'google'; }
  if (translator) return 'chrome';
  if (!('Translator' in self)) {
    if (want === 'chrome') alert('这个浏览器不支持 Chrome 内置翻译，已改用 Google 在线翻译。建议把 Chrome 更新到最新版。');
    return 'google';
  }
  try {
    const a = await Translator.availability({ sourceLanguage: 'en', targetLanguage: 'zh' });
    if (a === 'unavailable') return 'google';
    translator = await Translator.create({
      sourceLanguage: 'en', targetLanguage: 'zh',
      monitor(m){ m.addEventListener('downloadprogress', e => setStatus('正在下载离线翻译模型 ' + Math.round(e.loaded * 100) + '%')); }
    });
    return 'chrome';
  } catch (e) {
    console.warn('Chrome 内置翻译不可用', e);
    translator = null;
    return 'google';
  }
}

async function translate(text){
  if (!text.trim()) return '';
  if (translator) {
    try { return await translator.translate(text); }
    catch (e) { console.warn('内置翻译出错，改用 Google', e); }
  }
  const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q=' + encodeURIComponent(text);
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  return j[0].map(x => x[0]).join('');
}

/* ---------- 字幕行 ---------- */
function nearBottom(){ return stage.scrollHeight - stage.scrollTop - stage.clientHeight < 200; }
function scrollDown(force){ if (force || nearBottom()) stage.scrollTop = stage.scrollHeight; }

function makeLine(){
  $('empty')?.remove();
  const el = document.createElement('div');
  el.className = 'line live';
  el.innerHTML = '<p class="zh"></p><p class="en"></p>';
  stage.appendChild(el);
  return { el, en: '', zh: '', seq: 0, final: false };
}

function renderEn(obj){ obj.el.querySelector('.en').textContent = obj.en; }

async function fillZh(obj, draft){
  const my = ++obj.seq;
  const zhEl = obj.el.querySelector('.zh');
  try {
    const zh = await translate(obj.en);
    if (my !== obj.seq) return;          // 已有更新的翻译请求
    obj.zh = zh;
    zhEl.textContent = zh;
    zhEl.className = 'zh' + (draft ? ' draft' : '');
  } catch (e) {
    if (my !== obj.seq) return;
    zhEl.textContent = '翻译失败：请检查网络，或在右上角换一个翻译引擎。';
    zhEl.className = 'zh err';
  }
  scrollDown();
}

function onInterim(text){
  const stick = nearBottom();
  if (!current) current = makeLine();
  current.en = text;
  renderEn(current);
  scrollDown(stick);
  clearTimeout(draftTimer);
  const obj = current;
  draftTimer = setTimeout(() => { if (!obj.final) fillZh(obj, true); }, 600);
}

function onFinal(text){
  const stick = nearBottom();
  const obj = current || makeLine();
  current = null;
  clearTimeout(draftTimer);
  obj.en = text.trim();
  obj.final = true;
  obj.el.classList.remove('live');
  renderEn(obj);
  lines.push(obj);
  fillZh(obj, false);
  scrollDown(stick);
}

/* ---------- 语音识别 ---------- */
function buildRecognizer(){
  const r = new SR();
  r.lang = 'en-US';
  r.continuous = true;
  r.interimResults = true;
  r.maxAlternatives = 1;

  r.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) { if (t.trim()) onFinal(t); }
      else interim += t;
    }
    if (interim.trim()) onInterim(interim);
  };

  r.onerror = e => {
    if (e.error === 'no-speech' || e.error === 'aborted') return;
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      stop();
      setStatus('麦克风被拒绝：点地址栏左边的图标，把麦克风改成“允许”，再点开始。');
    } else if (e.error === 'network') {
      setStatus('语音识别连不上网络（Chrome 的识别需要联网），正在重试…', true);
    } else if (e.error === 'audio-capture') {
      stop();
      setStatus('找不到麦克风：检查麦克风是否插好，或在 Windows 声音设置里设为默认设备。');
    } else {
      setStatus('识别出错：' + e.error + '，正在重试…', true);
    }
  };

  // Chrome 会在静音或约一分钟后自动停止，这里自动续上
  r.onend = () => {
    if (!running) return;
    if (current && current.en) onFinal(current.en);
    setTimeout(() => { if (running) { try { r.start(); } catch (_) {} } }, 250);
  };
  return r;
}

async function start(){
  if (!SR) { alert('这个浏览器不支持语音识别，请用 Chrome 或 Edge 打开。'); return; }
  setStatus('准备中…');
  engineUsed = await setupTranslator();
  rec = rec || buildRecognizer();
  running = true;
  try { rec.start(); } catch (_) {}
  $('toggle').textContent = '停止';
  $('toggle').classList.add('stop');
  setStatus('正在听 · 翻译：' + (engineUsed === 'chrome' ? 'Chrome 内置' : 'Google 在线'), true);
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (_) {}
}

function stop(){
  running = false;
  try { rec && rec.stop(); } catch (_) {}
  $('toggle').textContent = '开始';
  $('toggle').classList.remove('stop');
  setStatus('已停止');
  try { wakeLock && wakeLock.release(); } catch (_) {}
  wakeLock = null;
}

$('toggle').onclick = () => running ? stop() : start();

$('engine').onchange = async () => {
  translator = $('engine').value === 'google' ? null : translator;
  if (running) {
    engineUsed = await setupTranslator();
    setStatus('正在听 · 翻译：' + (engineUsed === 'chrome' ? 'Chrome 内置' : 'Google 在线'), true);
  }
};

/* ---------- 显示设置 ---------- */
function applySize(){ document.documentElement.style.setProperty('--zh-size', $('size').value + 'px');
  if (pipWin) pipWin.document.documentElement.style.setProperty('--zh-size', $('size').value + 'px'); }
$('size').oninput = applySize;
$('showEn').onchange = () => stage.classList.toggle('no-en', !$('showEn').checked);

/* ---------- 悬浮窗 ---------- */
$('pipBtn').onclick = async () => {
  if (pipWin) { pipWin.close(); return; }
  if (!('documentPictureInPicture' in window)) {
    alert('这个浏览器不支持悬浮窗，请用最新版 Chrome 或 Edge。');
    return;
  }
  pipWin = await documentPictureInPicture.requestWindow({ width: 720, height: 240 });
  const style = pipWin.document.createElement('style');
  style.textContent = $('app-style').textContent;
  pipWin.document.head.appendChild(style);
  pipWin.document.title = '课堂同传';
  pipWin.document.body.className = 'pip';
  pipWin.document.body.appendChild(stage);
  applySize();
  scrollDown(true);
  $('pipBtn').textContent = '收回悬浮窗';
  pipWin.addEventListener('pagehide', () => {
    slot.appendChild(stage);
    pipWin = null;
    $('pipBtn').textContent = '悬浮窗';
    scrollDown(true);
  });
};

/* ---------- 导出 / 清空 ---------- */
$('exportBtn').onclick = () => {
  if (!lines.length) { alert('还没有内容可以导出。'); return; }
  const text = lines.map(l => l.en + '\n' + (l.zh || '')).join('\n\n');
  const d = new Date();
  const name = `课堂翻译-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}.txt`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

$('clearBtn').onclick = () => {
  if (lines.length && !confirm('清空所有字幕？没导出的内容会丢失。')) return;
  lines.length = 0;
  current = null;
  stage.querySelectorAll('.line').forEach(el => el.remove());
};

document.addEventListener('visibilitychange', async () => {
  if (running && document.visibilityState === 'visible' && !wakeLock) {
    try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (_) {}
  }
});
</script>
</body>
</html>
